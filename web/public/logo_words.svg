<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- FinHub 品牌字标：左侧星芒几何图标 + 右侧 FinHub 字样 -->
  <g>
    <!-- 星芒图标：中心圆 + 放射线 -->
    <circle cx="175" cy="225" r="62" fill="none" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#111111" stroke-width="10" stroke-linecap="round">
      <line x1="175" y1="105" x2="175" y2="150"/>
      <line x1="175" y1="300" x2="175" y2="345"/>
      <line x1="55" y1="225" x2="100" y2="225"/>
      <line x1="250" y1="225" x2="295" y2="225"/>
      <line x1="90" y1="140" x2="122" y2="172"/>
      <line x1="228" y1="278" x2="260" y2="310"/>
      <line x1="260" y1="140" x2="228" y2="172"/>
      <line x1="122" y1="278" x2="90" y2="310"/>
    </g>
    <circle cx="175" cy="225" r="18" fill="#111111"/>
  </g>
  <!-- 文字 -->
  <text x="300" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="120" font-weight="700" fill="#111111" letter-spacing="-1">FinHub</text>
</svg>
