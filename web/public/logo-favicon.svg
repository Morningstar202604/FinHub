<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FinHub Treasury Facade — light variant
       A treasury hall: pediment, architrave, three columns, stylobate.
       The gold disc in the pediment is the coin — the one thing a
       treasury exists to keep. Central-bank green on porcelain white. -->
  <rect width="56" height="56" rx="12" fill="#FDFCF9"/>
  <!-- pediment -->
  <path d="M10 21.5 L28 8 L46 21.5" stroke="#0F3D2E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the coin -->
  <circle cx="28" cy="16" r="2.8" fill="#C9A227"/>
  <!-- architrave -->
  <path d="M13 25.5 H43" stroke="#0F3D2E" stroke-width="3.2" stroke-linecap="round"/>
  <!-- columns -->
  <path d="M18 30 V43" stroke="#0F3D2E" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M28 30 V43" stroke="#0F3D2E" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M38 30 V43" stroke="#0F3D2E" stroke-width="3.2" stroke-linecap="round"/>
  <!-- stylobate -->
  <path d="M12 47.5 H44" stroke="#0F3D2E" stroke-width="3.2" stroke-linecap="round"/>
</svg>
