name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_override:
        description: "Explicit version tag (e.g. v1.0.0). Leave empty for auto CalVer."
        required: false
        default: ""
      dry_run:
        description: "Dry run — print notes to step summary without creating a release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: version
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            TAG="${{ inputs.version_override }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # tag 触发时直接使用推送上来的 tag 名，避免 runner 按 UTC 日期重算
            # 造成的版本号漂移（例如北京时间 09-19 被算成 v2026.09.18）
            TAG="${GITHUB_REF_NAME}"
          else
            BASE="v$(date -u +%Y.%m.%d)"
            if git tag -l "$BASE" | grep -q .; then
              N=1
              while git tag -l "${BASE}.${N}" | grep -q .; do
                N=$((N + 1))
              done
              TAG="${BASE}.${N}"
            else
              TAG="$BASE"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version tag: $TAG"

      - name: Find previous release tag
        id: prev
        run: |
          PREV=$(git tag --sort=-creatordate | head -1)
          if [ -n "$PREV" ]; then
            echo "range=${PREV}..HEAD" >> "$GITHUB_OUTPUT"
            echo "tag=$PREV" >> "$GITHUB_OUTPUT"
            echo "Previous tag: $PREV"
          else
            echo "range=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No previous tags — using full history"
          fi

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--version ${{ steps.version.outputs.tag }}"
          if [ -n "${{ steps.prev.outputs.range }}" ]; then
            ARGS="$ARGS --range ${{ steps.prev.outputs.range }}"
          fi
          if [ -n "${{ steps.prev.outputs.tag }}" ]; then
            ARGS="$ARGS --previous-tag ${{ steps.prev.outputs.tag }}"
          fi
          python3 scripts/ci/generate_release_notes.py $ARGS --output release_notes.md
          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package source bundle
        if: ${{ github.event_name == 'push' }}
        run: |
          mkdir -p dist
          # 固定文件名：README/官网上的 releases/latest/download/FinHub-source.zip
          # 直链才能长期有效（每次发版用 --clobber 覆盖同一个资产名）
          git archive --format=zip --prefix="FinHub/" \
            -o "dist/FinHub-source.zip" HEAD
          ls -lh dist/

      - name: Create release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # dispatch 手动触发保持 draft（人工审核 notes）；tag 推送直接发布并附源码包
          EXTRA_FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_FLAGS="--draft"
          else
            EXTRA_FLAGS="--latest"
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            $EXTRA_FLAGS \
            --notes-file release_notes.md \
            --target main \
            --title "${{ steps.version.outputs.tag }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release upload "${{ steps.version.outputs.tag }}" \
              "dist/FinHub-source.zip" --clobber
          fi
          echo "Release created: ${{ steps.version.outputs.tag }}"
