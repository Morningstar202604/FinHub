name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # `secrets` 上下文在 job 级 `if` 里不可用，所以不能在 claude job 上直接判空。
  # 改由这个前置 job 在 `env:`（此处允许读 secrets）里判空，再用 output 交给
  # 下游的 `needs.*`。只回显布尔值，不输出密钥。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_claude_token: ${{ steps.check.outputs.has_claude_token }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check whether the Anthropic OAuth token is configured
        id: check
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "has_claude_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_claude_token=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set — skipping Claude Code."
          fi

  claude:
    # Allow pull_request_review to pass through for inline comment checking
    #
    # 前置 has_claude_token：Anthropic OAuth token 没配时整个 job 跳过。否则每次
    # 有人 @claude，即使功能根本没开通，也会挂一个红叉把真正的 CI 问题淹掉。
    needs: preflight
    if: |
      needs.preflight.outputs.has_claude_token == 'true' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review') ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check review comments for @claude
        id: check_review
        if: github.event_name == 'pull_request_review'
        run: |
          # Fetch all inline comments from this review
          echo "Fetching review comments..."
          REVIEW_COMMENTS=$(gh api \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${{ github.event.review.id }}/comments \
            --jq '.[].body' 2>/dev/null || echo "")

          # Combine the review body (passed via env so it is never interpolated
          # into this script) with the inline comments, then check for @claude.
          ALL_TEXT="$REVIEW_COMMENTS $REVIEW_BODY"

          if echo "$ALL_TEXT" | grep -q "@claude"; then
            echo "has_claude=true" >> "$GITHUB_OUTPUT"
            echo "Found @claude in review"
          else
            echo "has_claude=false" >> "$GITHUB_OUTPUT"
            echo "No @claude found in review"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BODY: ${{ github.event.review.body }}

      - name: Run Claude Code
        id: claude
        if: |
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review' && steps.check_review.outputs.has_claude == 'true') ||
          (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude[bot]'
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(git mv:*)" "Bash(git rm:*)" "Bash(git checkout:*)" "Bash(git stash:*)" "Bash(git cherry-pick:*)" "Bash(cp:*)" "Bash(mv:*)" "Bash(mkdir:*)" "Bash(rm:*)" "Bash(rsync:*)" "Bash(npm:*)" "Bash(npx:*)" "Bash(pnpm:*)" "Bash(pip:*)" "Bash(uv:*)" "Bash(pytest:*)" "Bash(make:*)" "Bash(gh:*)" "Bash(ruff:*)" "Bash(python:*)" "Bash(python3:*)" "Bash(node:*)" "Bash(cat:*)" "Bash(ls:*)" "Bash(find:*)" "Bash(grep:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(wc:*)" "Bash(diff:*)" "Bash(sort:*)"
            --append-system-prompt "PR DESCRIPTION — when asked to fill, write, or revise the PR description (or when the comment is just '@claude' with no other instructions on a PR with an empty/template-only description), do the following: 1. Run 'gh pr diff <PR_NUMBER>' to understand all changes. 2. Run 'gh pr view <PR_NUMBER>' to read the current description. 3. Write a description following this template: ## Summary\n(What changed and why — 2-3 sentences)\n\n## Changes\n(Bullet list of key modifications)\n\n## Test Plan\n(How this was or should be tested). 4. Update in place with 'gh pr edit <PR_NUMBER> --body \"<description>\"'. 5. If revising an existing description, preserve any manually written context and improve/expand rather than replace. QUALITY GATES — before committing changes, run the relevant checks: Python changes: run 'ruff check . && ruff format --check .' and fix any issues. Frontend (web/) changes: run 'cd web && npx eslint .' and fix any issues. Backend changes: run 'uv run pytest tests/unit/ -x -q' to verify tests pass. NEVER commit .env files or credentials."
