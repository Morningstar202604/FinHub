# Development docker-compose — full-stack local setup
# Usage: cp .env.example .env && <fill in API keys> && docker compose up
#
# By default, starts PostgreSQL and Redis in Docker (COMPOSE_PROFILES=infra in .env).
# To use an external database/Redis, remove COMPOSE_PROFILES from .env and set
# DB_HOST, REDIS_URL to your own instances.

services:
  postgres:
    profiles: ["infra"]
    image: postgres:18
    restart: unless-stopped
    # The backend opens three pools (conversation 50 + checkpointer 25 +
    # writer 25 = 100), which exactly saturates the default max_connections
    # and starves migrations/healthchecks under load. Leave real headroom.
    command: ["postgres", "-c", "max_connections=250"]
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - finhub-postgresql-data:/var/lib/postgresql
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    profiles: ["infra"]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - finhub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dev
      args:
        INSTALL_OBSERVABILITY: ${INSTALL_OBSERVABILITY:-${OTEL_EXPORTER_OTLP_ENDPOINT:+true}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    pids_limit: 8192
    mem_limit: 8g
    memswap_limit: 8g
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file: .env
    environment:
      # User-supplied API keys are encrypted with this. It MUST be unique per
      # deployment — the old default shipped in the repo, which meant every
      # install could decrypt every other install's BYOK vault.
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:?BYOK_ENCRYPTION_KEY is required. Generate one with `openssl rand -hex 32`; it encrypts user-supplied API keys at rest.}
      # HOST_MODE=oss (the default) has no authentication. This stack is the
      # documented self-hosted single-tenant setup, so binding to all
      # interfaces is intended — but it must be stated explicitly, since the
      # server now refuses to serve oss mode on a non-loopback bind otherwise.
      ALLOW_INSECURE_OSS: ${ALLOW_INSECURE_OSS:-true}
      # Sandbox containers are created through the socket-proxy service.
      DOCKER_HOST: ${DOCKER_HOST:-tcp://socket-proxy:2375}
      # Default to Docker service names for inter-container networking.
      # Override in .env to connect to external services or for host dev.
      DB_HOST: ${DB_HOST:-postgres}
      REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis}@redis:6379/0}"
    volumes:
      # Mount source for hot-reload
      - ./src:/app/src
      - ./server.py:/app/server.py
      - ./agent_config.yaml:/app/agent_config.yaml
      # Required when SANDBOX_PROVIDER=docker and the backend auto-builds
      # finhub-sandbox:latest on first workspace creation.
      - ./Dockerfile.sandbox:/app/Dockerfile.sandbox:ro
      # Sandbox containers are driven through the socket-proxy service below
      # instead of the raw host socket. Mounting /var/run/docker.sock directly
      # is equivalent to handing out host root — anything that reaches the
      # backend (or any code the agent runs inside it) can start a privileged
      # container and own the machine. To go back to the DooD pattern, drop
      # DOCKER_HOST and re-add:
      #   - ${DOCKER_HOST_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Read-only: the backend only loads MCP/plugin definitions from these.
      # A writable mount here lets anything that reaches the backend drop an
      # executable into the app tree.
      - ./config.yaml:/app/config.yaml
      - ./mcp_servers:/app/mcp_servers:ro
      - ./plugins:/app/plugins:ro
      - ./scripts:/app/scripts:ro
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Least-privilege Docker API for the sandbox provider. Only the endpoints
  # DockerProvider actually uses are enabled; notably VOLUMES/SECRETS/SWARM/
  # PLUGINS stay off, so a compromised backend cannot mount the host FS.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      # Required for create/start/exec/build — the write side of the API.
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_PROXY_BACKEND: http://backend:8000
      # macOS bind mounts don't forward fsevents, so enable Vite/chokidar
      # polling in-container to keep HMR alive (vite.config.js reads this).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/app/.pnpm-store

volumes:
  finhub-postgresql-data:
  finhub-redis-data:
  frontend_node_modules:
  frontend_pnpm_store:
